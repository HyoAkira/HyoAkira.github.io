<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Apprenticeship gap banner</title>
  <desc id="bannerDesc">A staircase of solid steps with the final step drawn as a dashed outline, connected by a rising arc.</desc>
  <rect width="1200" height="630" fill="#F6F5F0"/>
  <rect x="0" y="0" width="1200" height="6" fill="#B3402A"/>

