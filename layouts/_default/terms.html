{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}

{{ define "main" }}
<div class="w-full px-6 py-space-xl">
  <div class="max-w-7xl mx-auto flex flex-col gap-space-lg">
    <h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">{{ .Title }}</h1>
    {{ .Content }}
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-space-lg">
      {{ range .Pages }}
        <article class="post-card bg-surface border border-outline rounded-lg p-6 flex flex-col gap-space-sm">
          <h2 class="font-headline-md text-headline-md text-on-surface leading-tight line-clamp-2">
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </h2>
          <p class="text-body-sm text-on-surface-variant line-clamp-3">
            {{ with .Description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}
          </p>
        </article>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
