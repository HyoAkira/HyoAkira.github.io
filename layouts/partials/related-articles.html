{{/* Related articles — quiet text list */}}
{{ with site.RegularPages.Related . | first 5 }}
  <section class="bg-surface border border-outline rounded-lg p-6 flex flex-col gap-space-sm" aria-labelledby="related-heading">
    <h2 id="related-heading" class="font-headline-sm text-headline-sm text-on-surface">{{ i18n "related" }}</h2>
    <ul class="flex flex-col">
      {{ range . }}
        <li class="border-b border-outline last:border-0 py-2 first:pt-0 last:pb-0">
          <a href="{{ .RelPermalink }}" class="flex items-baseline justify-between gap-3 no-underline py-1">
            <span class="text-body-sm font-semibold text-on-surface line-clamp-2">{{ .Title }}</span>
            <span class="shrink-0 text-label-md font-medium text-on-surface-variant">{{ .Date.Format "2 January 2006" }}</span>
          </a>
        </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
