{{/* Footer — single line, quiet */}}
<footer class="border-t border-outline bg-background">
  <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
    <p class="text-body-sm text-on-surface-variant">&copy; {{ now.Year }} {{ .Site.Params.author }}.</p>
    <div class="flex items-center gap-1">
      {{ with .Site.Params.social.github }}
        <a href="https://github.com/{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="inline-flex items-center justify-center w-10 h-10 rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">code</span>
        </a>
      {{ end }}
      {{ with .Site.Params.social.linkedin }}
        <a href="https://linkedin.com/in/{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="inline-flex items-center justify-center w-10 h-10 rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">work</span>
        </a>
      {{ end }}
    </div>
  </div>
</footer>
