{{/* Header partial */}}
<header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.25)]">
  <div class="h-20 w-full px-gutter flex items-center justify-between gap-space-md">
    <div class="flex items-center gap-space-lg">
      <a class="flex items-center gap-space-sm group" href="{{ .Site.BaseURL }}">
        <span class="font-headline-sm text-headline-sm text-primary group-hover:text-primary-container transition-colors tracking-tight">{{ .Site.Title }}</span>
      </a>
      <nav class="hidden md:flex items-center gap-space-xs p-1 rounded-xl bg-surface-container-low">
        {{ range .Site.Menus.main }}
          <a class="px-space-md py-space-sm text-on-surface-variant font-label-lg text-label-lg transition-colors hover:text-on-surface hover:bg-surface-container-high rounded-xl" href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
    <div class="flex items-center gap-space-md">
      <div class="relative hidden sm:block w-48 lg:w-64">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[18px]">search</span>
        <input class="w-full bg-surface-container-low text-on-surface pl-9 pr-space-md py-space-sm rounded-xl font-body-sm text-body-sm placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary-container transition-all" placeholder="Evreni keşfet..." type="text">
      </div>
      <button class="flex items-center gap-space-xs px-space-sm py-1.5 rounded-full bg-surface-container-low hover:bg-surface-container-high text-secondary-fixed-dim hover:text-secondary font-label-md text-label-md transition-all" type="button">
        <span class="material-symbols-outlined text-[16px]">language</span>
        <span class="font-label-md text-label-md tracking-wider font-semibold">TR / EN</span>
      </button>
    </div>
  </div>
</header>
