{{ define "title" }}{{ .Site.Title }}{{ end }}

{{ define "main" }}
<section>
  <h1>{{ .Site.Title }}</h1>
  <p>{{ .Site.Params.description }}</p>
  <h2>Recent posts</h2>
  <ul class="post-list">
    {{ range first 10 .Site.RegularPages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span>{{ .Date.Format "2006-01-02" }}</span>
      </li>
    {{ end }}
  </ul>
  <p><a href="/posts/">All posts →</a></p>
</section>
{{ end }}
