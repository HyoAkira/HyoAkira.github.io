baseURL = "https://hyoakira.github.io/"
defaultContentLanguage = "tr"
defaultContentLanguageInSubdir = false
locale = "tr"
title = "Umut Can AKÇAY"
copyright = "© 2026 Umut Can AKÇAY"
enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[params]
  description = "Personal, non-academic writings on software engineering, mathematics, and more."
  author = "Umut Can AKÇAY"
  email = "can.akcay@aol.com"
  [params.social]
    github = "hyoakira"
    linkedin = "umutcanakcay"

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  posts = "/posts/:slug/"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[services]
  [services.rss]
    limit = 20

[privacy]
  [privacy.googleAnalytics]
    disable = true
    respectDoNotTrack = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]
  [markup.highlight]
    style = "dracula"
    lineNos = true
    codeFences = true

[minify]
  minifyOutput = true

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", ":git", "date"]

[languages]
  [languages.tr]
    languageName = "Türkçe"
    weight = 1
    title = "Umut Can AKÇAY"
    [languages.tr.params]
      description = "Kişisel, akademik olmayan yazılar: yazılım mühendisliği, matematik ve daha fazlası."
    [languages.tr.menus]
      [[languages.tr.menus.main]]
        name = "Anasayfa"
        pageRef = "/"
        weight = 10
      [[languages.tr.menus.main]]
        name = "Postlar"
        pageRef = "/posts/"
        weight = 20
      [[languages.tr.menus.main]]
        name = "Hakkımda"
        pageRef = "/about/"
        weight = 30
  [languages.en]
    languageName = "English"
    weight = 2
    title = "Umut Can AKÇAY"
    [languages.en.params]
      description = "Personal, non-academic writings on software engineering, mathematics, and more."
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = "Home"
        pageRef = "/"
        weight = 10
      [[languages.en.menus.main]]
        name = "Posts"
        pageRef = "/posts/"
        weight = 20
      [[languages.en.menus.main]]
        name = "About"
        pageRef = "/about/"
        weight = 30

[related]
  includeNewer = true
  threshold = 70
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 80
  [[related.indices]]
    name = 'keywords'
    weight = 100
  [[related.indices]]
    name = 'date'
    weight = 10
    pattern = '2006'
